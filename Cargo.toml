[workspace]
resolver = "3"
members = [
  "crates/*",
  "examples/*",
  "support/benchmark",
  "support/guest-build",
  "support/file-scenarios",
  "support/http-scenarios",
  "support/policies/*",
]

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/luizribeiro/sleeve"
version = "0.0.0"
publish = false

[workspace.dependencies]
anyhow = "1"
serde_json = "1"
sha2 = "0.10"
spin = { version = "0.10", default-features = false, features = [
  "mutex",
  "spin_mutex",
] }
tokio = { version = "1", features = ["macros", "rt"] }
tempfile = "3"
wac-graph = "0.11"
wasmparser = "0.258"
wasmtime = { version = "49", default-features = false, features = [
  "component-model",
  "component-model-async",
  "runtime",
] }
wasmtime-wasi = "49"
wasmtime-wasi-http = { version = "49", default-features = false, features = [
  "default-send-request",
  "p3",
] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = "warn"
